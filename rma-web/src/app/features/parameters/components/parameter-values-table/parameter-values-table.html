<table>
  <thead>
    <tr>
      <th>CÓDIGO</th>
      <th>VALOR</th>
      <th>TIPO</th>
      <th>VERSIÓN</th>
      <th>VIGENCIA</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    @for (row of rows(); track row.code) {
      <tr>
        <td class="code">{{ row.code }}</td>
        <td>{{ row.value | displayValue }} {{ row.unit }}</td>
        <td>{{ row.dataType }}</td>
        <td>{{ row.versionNumber }}</td>
        <td>{{ row.effectiveFrom | date: 'short' }}</td>
        <td><button class="text-button" (click)="viewDetail.emit(row)">Ver detalle →</button></td>
      </tr>
    }
  </tbody>
</table>

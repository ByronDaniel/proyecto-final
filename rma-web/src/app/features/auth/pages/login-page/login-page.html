<main class="login-page">
  <div class="login-brand">
    <span class="brand-mark">R</span>
    <strong>RMA</strong>
    <span>Rule Manager</span>
  </div>

  <section class="login-content">
    <div class="eyebrow">PLATAFORMA INTERNA</div>
    <h1>Rule Manager</h1>
    <form class="login-form" (ngSubmit)="login()">
      <h2>Iniciar sesión</h2>
      <label>
        Usuario
        <input name="username" [(ngModel)]="username" autocomplete="username" required />
      </label>
      <label>
        Contraseña
        <input
          name="password"
          [(ngModel)]="password"
          type="password"
          autocomplete="current-password"
          required
        />
      </label>
      @if (error) {
        <div class="alert error" role="alert">{{ error }}</div>
      }
      <button class="primary" type="submit" [disabled]="busy || !username || !password">
        {{ busy ? 'Ingresando...' : 'Ingresar' }} <span>→</span>
      </button>
    </form>
  </section>

  <footer>RULE MANAGER API <span>ACCESO INTERNO</span></footer>
</main>
